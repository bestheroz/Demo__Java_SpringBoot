# Gradle 빌드 옵션. 이 세 값을 CI 워크플로의 명령줄 플래그(`--configuration-cache --build-cache --parallel`)로만
# 두면 로컬 빌드와 IDE 빌드는 혜택을 받지 못한다. 파일로 두어 터미널·IDE·CI 가 같은 조건으로 빌드한다.

# 설정 캐시 — 태스크 그래프 계산 결과를 재사용한다.
# 이 리포가 쓰는 태스크는 호환을 확인했다 — build, bootJar, spotlessCheck(cleanthat + google-java-format), dependencyUpdates.
#
# 예외: versionCatalogUpdate 는 실행 시점에 Task.project 를 써서
# 설정 캐시와 호환되지 않는다. 빌드는 성공하지만 매번 "Configuration cache entry discarded" 가 뜬다.
# 가끔 도는 유지보수용 태스크라 그대로 둔다.
org.gradle.configuration-cache=true

# 빌드 캐시 — compileJava / spotlessJava 산출물을 재사용한다.
org.gradle.caching=true

# 병렬 실행 — 지금은 단일 모듈이라 차이가 없다. CI 와 조건을 맞추고,
# 모듈이 늘어나면 그때부터 자동으로 효과를 보도록 켜 둔다.
org.gradle.parallel=true
