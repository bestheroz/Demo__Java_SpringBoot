name: test
on:
  push:
    branches-ignore: [ sandbox, qa ]
    tags-ignore: ['**']
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@main
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@main
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          dependency-graph: disabled
          add-job-summary: never

      # --parallel / --configuration-cache / --build-cache 는 gradle.properties 로 옮겼다.
      # 여기에만 두면 로컬·IDE 빌드는 같은 이점을 못 받아서, 한 곳에서 관리한다.
      # --no-daemon 은 남긴다(러너는 일회용이라 데몬을 남겨 둘 이유가 없다).
      # -Dspring.profiles.active 를 줘도 Gradle JVM 에만 걸리고 jar 에는 아무 영향이 없어서 뺐다.
      - name: Spotless Check and Build
        run: ./gradlew spotlessCheck assemble --no-daemon -x test
