# Gradle 버전 카탈로그. build.gradle 은 의존성·플러그인 좌표를 전부 여기서 `libs.xxx` 로 가져온다.
#
# Demo 정책: 신규 버전 선체험과 변화점 발견이 목적이라 사전 릴리스(M·RC·Beta·Alpha 등)를 허용하고 우선한다.
# versionCatalogUpdate 는 LATEST 선택기, dependencyUpdates 는 rejectPreReleases = false 로 둔다(build.gradle).
#
# 라이브러리 항목은 두 종류다. 섞으면 의도가 조용히 바뀌므로 추가할 때 어느 쪽인지 먼저 판단한다.
#  - 버전 없는 항목 `{ module = "..." }` — Spring Boot BOM 이 정하는 것(spring-boot-starter-*,
#    spring-boot-configuration-processor, lombok, aspectjweaver).
#    Boot 플러그인을 사전 릴리스 포함 최신으로 올리면 이 항목들도 그 BOM 이 고른 버전을 따라간다.
#  - 버전 있는 항목 — BOM 이 모르는 것, 그리고 BOM 이 관리하지만 BOM 보다 앞서 체험하려고 버전을 적은 것(mysql-connector-j).
#    직접 적은 버전은 BOM 을 이긴다. `./gradlew versionCatalogUpdate` 는 이쪽만 사전 릴리스 포함 최신으로 올린다.
#    BOM 관리 좌표에 버전을 새로 적는 것은 BOM 보다 앞서 가겠다는 결정이다. 그 의도가 없으면 버전 없이 넣는다.
#
# 올린 버전이 깨지고 코드로 고칠 수 없으면, 그 항목만 동작하는 최신 버전으로 내리고 바로 위 줄에 `# @pin` 을 단다.
#
# versionCatalogUpdate 가 이 파일을 다시 쓸 때 항목 옆 주석은 사라질 수 있다. 남겨야 하는 설명은
# build.gradle 에 두고, 여기서는 `@pin`(버전 고정) / `@keep`(미사용 항목 유지) 애노테이션만 쓴다.
[versions]
sentry = "8.57.0"

[libraries]
aspectjweaver = { module = "org.aspectj:aspectjweaver" }
jansi = "org.fusesource.jansi:jansi:2.4.3"
java-jwt = "com.auth0:java-jwt:4.6.1"
lombok = { module = "org.projectlombok:lombok" }
mysql-connector-j = "com.mysql:mysql-connector-j:26.7.0"
p6spy-spring-boot-starter = "com.github.gavlyukovskiy:p6spy-spring-boot-starter:2.0.1"
sentry-logback = { module = "io.sentry:sentry-logback", version.ref = "sentry" }
sentry-spring-boot4 = { module = "io.sentry:sentry-spring-boot-4", version.ref = "sentry" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
springdoc-openapi-starter-webmvc-ui = "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1"

[plugins]
ben-manes-versions = "io.github.ben-manes.versions:0.64.0"
spotless = "com.diffplug.spotless:8.10.2"
spring-boot = "org.springframework.boot:4.2.0-M1"
spring-dependency-management = "io.spring.dependency-management:1.1.7"
version-catalog-update = "nl.littlerobots.version-catalog-update:1.1.1"
